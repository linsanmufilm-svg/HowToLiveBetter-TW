# 正文一改就重新生成四樣，掛到固定的 Release「epub-latest」上，下載連結不變：
#   EPUB        https://github.com/linsanmufilm-svg/HowToLiveBetter-TW/releases/download/epub-latest/HowToLiveBetter.epub
#   PDF         https://github.com/linsanmufilm-svg/HowToLiveBetter-TW/releases/download/epub-latest/HowToLiveBetter.pdf
#   離線單檔案  https://github.com/linsanmufilm-svg/HowToLiveBetter-TW/releases/download/epub-latest/HowToLiveBetter.html
#   Anki 牌組  https://github.com/linsanmufilm-svg/HowToLiveBetter-TW/releases/download/epub-latest/HowToLiveBetter.apkg
# PR 只生成並校驗，不釋出，產物在 Actions 頁面的 artifact 裡。
name: 電子書

on:
  push:
    branches: [main]
    paths:
      - README.md
      - index.html
      - selfcheck.html
      - og.png
      - ads/**
      - book/**
      - docs/*.md
      - tools/**
      - .github/workflows/book.yml
  pull_request:
    paths:
      - README.md
      - index.html
      - selfcheck.html
      - og.png
      - ads/**
      - book/**
      - docs/*.md
      - tools/**
      - .github/workflows/book.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

env:
  PANDOC_VERSION: '3.11'
  TYPST_VERSION: '0.15.1'

jobs:
  # 交叉引用檢查。單獨一個 job，不掛在 build 裡：錨點沒補好不該連累 EPUB、PDF 和
  # 離線單檔案的釋出，那是兩回事。PR 上照樣紅，main 上該發的還是發出去。
  # 本地那條鏈路（sync-stats.mjs）要記得跑才會跑，
  # 外部 PR 更是完全跑不到，所以這道檢查得在 CI 裡有一份。零依賴，幾秒鐘。
  refs:
    name: 交叉引用檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-refs.mjs --check

  # 說人話檢查：長度、研究行話、抽象說法。理由同上，單獨一個 job，不擋釋出。
  plain:
    name: 說人話檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-plain.mjs

  # 拆分規則一致性檢查：超長收益、備註和來源的拆分規則有兩份（tools/lib/split-items.mjs 給 EPUB、PDF，
  # index.html 裡 <split-rules> 那段給網頁和離線版），只改了一邊就會四個出口長得不一樣。理由同上，不擋釋出。
  split:
    name: 拆分規則一致性檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-split.mjs

  # 統計數字檢查：README、index.html、og.html 裡的條目數、A/B/C 數、連結數等是否和 book/ 對得上。
  # 本地 sync-stats.mjs 要記得跑才會更新，網頁上直接合並的 PR 完全經過不了它。理由同上，不擋釋出。
  # 只查不改：讓 CI 往 main 推提交會和本地分叉，而且 Ubuntu 沒有微軟雅黑，og.png 截不對。
  stats:
    name: 統計數字檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # updates.mjs 要翻 git 歷史
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/sync-stats.mjs --check
      - run: node tools/updates.mjs --check

  selfcheck:
    name: 自查條件檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-selfcheck.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/epub/package-lock.json

      - run: npm ci
        working-directory: tools/epub

      - name: EPUB
        run: node tools/epub/build.mjs

      - name: 離線單檔案 HTML
        run: node tools/offline/build.mjs

      - name: Anki 牌組
        run: node tools/anki/build.mjs

      - name: 裝 pandoc、typst 和中文字型
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          curl -sSL "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz" | tar xz
          curl -sSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar xJ
          echo "$PWD/pandoc-${PANDOC_VERSION}/bin" >> "$GITHUB_PATH"
          echo "$PWD/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: PDF
        run: |
          typst fonts | grep -i -E 'noto (serif|sans) cjk' || echo '沒找到 Noto CJK，PDF 會退到別的字型，檢查 fonts-noto-cjk 這一步'
          node tools/pdf/build.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: epubcheck
        run: |
          curl -sSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip
          java -jar epubcheck-5.4.0/epubcheck.jar dist/HowToLiveBetter.epub

      - uses: actions/upload-artifact@v4
        with:
          name: HowToLiveBetter
          path: |
            dist/HowToLiveBetter.epub
            dist/HowToLiveBetter.pdf
            dist/HowToLiveBetter.html
            dist/HowToLiveBetter.apkg

      - name: 釋出到 Release epub-latest
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f epub-latest
          git push -f origin epub-latest
          notes="正文提交 ${GITHUB_SHA::7}，生成於 $(date -u -d '+8 hours' +'%Y-%m-%d %H:%M')（北京時間）。EPUB、PDF、離線單檔案 HTML、Anki 牌組四樣，正文每次更新後自動重新生成，下載連結固定不變。"
          if gh release view epub-latest >/dev/null 2>&1; then
            gh release edit epub-latest --title "電子書（EPUB / PDF / 離線 HTML / Anki，自動更新）" --notes "$notes"
          else
            gh release create epub-latest --title "電子書（EPUB / PDF / 離線 HTML / Anki，自動更新）" --notes "$notes" --latest=false
          fi
          gh release upload epub-latest \
            dist/HowToLiveBetter.epub \
            dist/HowToLiveBetter.pdf \
            dist/HowToLiveBetter.html \
            dist/HowToLiveBetter.apkg --clobber
