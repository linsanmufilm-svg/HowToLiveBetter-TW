# 失效連結檢查：每週一跑一次全書外鏈，結果寫在這次執行的 Summary 頁裡。
# 只報告不報錯（指令碼退出碼恆為 0），所以這個工作流永遠是綠的，要看結果得點進去。
# 「確定失效」那一檔（404、410、DOI 查無此號）才需要修；
# 「沒連上」多半是 gov.cn 擋了境外機房 IP，連著幾週都在才值得看；
# 「加密握手不相容」是老政府站的加密方式 Node 不認，瀏覽器能開，不用修。
# 不掛在 book.yml 裡：幾百個外站的通斷跟正文改沒改無關，每次推送都跑既慢又吵。
name: 失效連結檢查

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: 失效連結檢查
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-links.mjs
